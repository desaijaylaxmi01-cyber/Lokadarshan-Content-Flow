<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Newsdesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <a href="#/" class="brand"><span class="brand-mark">ND</span> Newsdesk</a>
    <nav>
      <a href="#/" data-nav="stories">Stories</a>
      <a href="#/new" data-nav="new">+ New story</a>
      <a href="#/admin" data-nav="admin" id="nav-admin" hidden>Admin</a>
    </nav>
    <div class="user">
      <span id="user-name"></span>
      <button class="link" id="btn-password">Password</button>
      <button class="link" id="btn-logout">Sign out</button>
    </div>
  </header>
  <main id="app"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
